name: Security checks
on:
  push:
    paths:
      - ".github/workflows/security.yml"
      - "clever-ai/**"
      - "labs/**"
      - "ai-config.js"
      - "ai-chat.js"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
